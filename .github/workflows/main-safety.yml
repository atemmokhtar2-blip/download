name: Main branch safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate anti-spam policy source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          helper = ast.parse(Path("database/interaction_abuse.py").read_text())
          bot = ast.parse(Path("bot.py").read_text())
          assert any(isinstance(n, ast.FunctionDef) and n.name == "check_repeated_action" for n in helper.body)
          assert any(isinstance(n, ast.FunctionDef) and n.name == "active_ban_seconds" for n in helper.body)
          assert any(isinstance(n, ast.FunctionDef) and n.name == "forced_subscription_guard" for n in bot.body)
          source = Path("database/interaction_abuse.py").read_text()
          assert "_WINDOW_SECONDS = 10" in source
          assert "_SUPPRESS_AFTER = 3" in source
          assert "_BAN_AFTER = 6" in source
          assert "_BAN_MINUTES = 5" in source
          print("Anti-spam source checks passed.")
          PY
