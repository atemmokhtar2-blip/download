<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b"><title>XELVOR Control</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#141417;--panel2:#1b1b20;--line:#29292f;--red:#a30f25;--red2:#e11d3f;--muted:#9999a4;--text:#f5f5f7;--green:#28c58a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% -15%,#46101b 0,transparent 42%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));}
.wrap{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 22px}.brand{font-weight:900;letter-spacing:2px;font-size:19px}.brand b{color:var(--red2)}.status{font-size:11px;color:#d8a1aa;border:1px solid #57202b;padding:6px 10px;border-radius:30px;background:#270d13}
h1{font-size:25px;margin:8px 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 14px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 15px;border-radius:12px;white-space:nowrap;font:inherit}.tab.active{background:#3b1019;border-color:#7c1d30;color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric,.panel{background:linear-gradient(145deg,#19191e,#101014);border:1px solid var(--line);border-radius:17px;padding:15px}.metric small{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin-top:8px;direction:ltr;text-align:right}.metric em{display:block;font-style:normal;color:#d35b70;font-size:11px;margin-top:3px}
.panel{margin-top:12px}.panel h2{font-size:15px;margin:0 0 12px}.platform,.audit,.user{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #26262c;font-size:13px}.platform:first-of-type,.audit:first-of-type,.user:first-of-type{border-top:0}.muted{color:var(--muted);font-size:12px}.bar{height:5px;background:#2b171d;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ef526b);border-radius:9px}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#101014;color:white;padding:12px;font:inherit;outline:none;margin-bottom:9px}button.action{border:1px solid #722034;background:#3a101a;color:white;border-radius:10px;padding:8px 11px;font:inherit;font-size:12px}button.action.secondary{background:#202026;border-color:#36363d}.hidden{display:none!important}.empty{color:var(--muted);padding:20px;text-align:center;font-size:13px}.notice{padding:12px;border-radius:12px;background:#261016;border:1px solid #672033;color:#f1c4cc;font-size:13px;margin:12px 0}.loader{color:var(--muted);padding:28px;text-align:center}.foot{color:#676772;text-align:center;font-size:10px;padding:22px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.metric strong{font-size:28px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand">〆 <b>XELVOR</b> CONTROL</div><span class="status" id="live">● اتصال آمن</span></header>
<h1>مركز القيادة</h1><p class="sub">إدارة ومراقبة بوت التحميل من داخل Telegram</p>
<div id="notice" class="notice hidden"></div>
<nav class="tabs"><button class="tab active" data-tab="overview">نظرة عامة</button><button class="tab" data-tab="users">المستخدمون</button><button class="tab" data-tab="activity">سجل الإدارة</button></nav>
<section id="overview"><div id="metrics" class="grid"><div class="loader">جارٍ تحميل البيانات…</div></div><div class="panel"><h2>المنصات الأكثر استخدامًا · آخر 7 أيام</h2><div id="platforms"></div></div></section>
<section id="users" class="hidden"><div class="panel"><h2>إدارة المستخدمين</h2><input id="search" placeholder="ابحث بالاسم أو @username أو Telegram ID"><select id="filter"><option value="all">كل المستخدمين</option><option value="active">النشطون</option><option value="banned">المحظورون</option></select><div id="users-list"><div class="loader">ابحث أو اختر حالة المستخدمين</div></div></div></section>
<section id="activity" class="hidden"><div class="panel"><h2>آخر العمليات الإدارية</h2><div id="audit"></div></div></section>
<div class="foot">XELVOR · SECURE TELEGRAM MINI APP</div></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('en-US').format(Number(n||0));
function showError(msg){$('notice').textContent=msg;$('notice').classList.remove('hidden')}
async function api(path,options={}){const init=tg?.initData||'';if(!init)throw new Error('افتح اللوحة من داخل Telegram فقط.');const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'tma '+init,...options.headers}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||'تعذر تنفيذ الطلب');return data}
function metric(label,value,note=''){const display=typeof value==='string'?esc(value):fmt(value);return '<article class="metric"><small>'+label+'</small><strong>'+display+'</strong><em>'+note+'</em></article>'}
async function loadDashboard(){const d=await api('/api/mini-admin/dashboard');const m=d.metrics;$('metrics').innerHTML=metric('إجمالي المستخدمين',m.users,'+'+fmt(m.new_users_today)+' اليوم)+metric('تحميلات اليوم',m.downloads_today,'آخر 24 ساعة: '+fmt(m.downloads_24h))+metric('إجمالي التحميلات',m.downloads_total,'آخر 7 أيام: '+fmt(m.downloads_week))+metric('المستخدمون المحظورون',m.banned_users,'إدارة آمنة بالصلاحيات')+metric('عناصر الكاش',m.cache_items,'مرات استخدام الكاش: '+fmt(m.cache_hits))+metric('حجم البيانات', (m.data_bytes/1024/1024).toFixed(1)+' MB','حجم الملفات المسجل');
const max=Math.max(1,...d.platforms.map(x=>Number(x.cnt)));$('platforms').innerHTML=d.platforms.length?d.platforms.map(p=>'<div class="platform"><div style="flex:1"><b>'+esc(p.platform)+'</b><div class="bar"><i style="width:'+Math.max(2,p.cnt/max*100)+'%"></i></div></div><b>'+fmt(p.cnt)+'</b></div>').join(''):'<div class="empty">لا توجد بيانات بعد</div>';
$('audit').innerHTML=renderAudit(d.audit);$('live').textContent='● متصل الآن'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderAudit(rows){return rows.length?rows.map(x=>'<div class="audit"><div><b>'+esc(x.action)+'</b><div class="muted">Admin '+esc(x.admin_id)+' · Target '+esc(x.target_id||'—')+'</div></div><span class="muted">'+esc(x.created_at||'')+'</span></div>').join(''):'<div class="empty">لا توجد عمليات مسجلة</div>'}
async function loadUsers(){const q=$('search').value.trim(),status=$('filter').value;const d=await api('/api/mini-admin/users?q='+encodeURIComponent(q)+'&status='+status);$('users-list').innerHTML=d.items.length?d.items.map(u=>'<div class="user"><div style="min-width:0"><b>'+esc(u.first_name||'مستخدم')+'</b><div class="muted">'+(u.username?'@'+esc(u.username)+' · ':'')+esc(u.user_id)+' · '+fmt(u.downloads)+' تحميل</div></div><button class="action '+(u.is_banned?'secondary':'')+'" data-id="'+Number(u.user_id)+'" data-banned="'+(u.is_banned?1:0)+'">'+(u.is_banned?'فك الحظر':'حظر')+'</button></div>').join(''):'<div class="empty">لا توجد نتائج</div>';
document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.id;try{if(b.dataset.banned==='1'){await api('/api/mini-admin/users/'+id+'/unban',{method:'POST',body:'{}'})}else{const reason=prompt('سبب الحظر (اختياري):')??null;if(reason===null)return;await api('/api/mini-admin/users/'+id+'/ban',{method:'POST',body:JSON.stringify({reason})})}await loadUsers();await loadDashboard()}catch(e){showError(e.message)}}))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['overview','users','activity'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='users')loadUsers().catch(e=>showError(e.message))}));
$('search').addEventListener('input',()=>{clearTimeout(window._searchTimer);window._searchTimer=setTimeout(()=>loadUsers().catch(e=>showError(e.message)),350)});$('filter').addEventListener('change',()=>loadUsers().catch(e=>showError(e.message)));
(async()=>{try{await api('/api/mini-admin/me');await loadDashboard()}catch(e){showError(e.message);$('live').textContent='● غير متصل'}})();
</script></body></html>
